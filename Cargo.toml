[workspace]
members = [
  "crates/common",
  "crates/api",
  "crates/worker",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros", "multipart"] }
aws-config = "1.5"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.66"
http = "1.2"
redis = { version = "0.27", features = ["streams", "tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
tokio = { version = "1.42", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2.5"
uuid = { version = "1.11", features = ["serde", "v4"] }
