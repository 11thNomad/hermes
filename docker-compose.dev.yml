services:
  api:
    build:
      target: dev
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    command: ["cargo", "watch", "--poll", "-x", "run -p api"]

  worker:
    build:
      target: dev
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    command: ["cargo", "watch", "--poll", "-x", "run -p worker"]

  frontend:
    build:
      target: dev
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "300"
    command:
      [
        "sh",
        "-lc",
        "if [ ! -x node_modules/.bin/vite ]; then npm install; fi && npm run dev"
      ]
    ports:
      - "5173:5173"

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
  frontend-node-modules:
